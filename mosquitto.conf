# Konfigurasi MQTT standar (untuk ESP32 di jaringan lokal)
listener 1883
allow_anonymous true

# MQTT over WebSockets
listener 9001
protocol websockets
allow_anonymous true

# CATATAN: allow_anonymous true = siapa pun yang bisa menjangkau port ini bisa kirim/terima pesan.
# Jangan buka port 1883/9001 ke internet tanpa menambahkan password_file.
